# Builds installable Windows binaries of the package so a machine does not
# have to compile 28 translation units of C++ to get it. Every push to main
# refreshes the assets on the `win-latest` pre-release, which is a rolling
# tag: the download URLs never change, so the install line in the README
# keeps working.
#
# A Windows binary is tied to the minor version of R it was built against --
# R looks for `bin/windows/contrib/4.6` and refuses a 4.5 build -- so there
# is one asset per supported minor version, named after it.
#
# The asset name is not free-form. `install.packages(<url>, repos = NULL,
# type = "win.binary")` works out the package name from the file name alone,
# in `utils:::.install.winbinary`:
#
#     pkgnames <- sub("[.]zip$", "", basename(pkgs))
#     pkgnames <- sub("_[0-9.-]+$", "", pkgnames)
#
# and then looks for that name as the top-level directory inside the zip. So
# everything after the first `_` has to be digits, dots and dashes: an R in
# it (`fast.string-win-R4.6.zip`) leaves the whole string as the package
# name and the install dies with
#
#     cannot open compressed file 'fast.string-win-R4.6/DESCRIPTION'
#
# Hence `fast.string_<pkg version>-<R minor>.zip`, e.g.
# `fast.string_0.3.0-4.6.zip`, which reduces to `fast.string` and matches the
# directory `R CMD INSTALL --build` puts in the zip.
name: windows-binary

on:
  push:
    branches: [main]
    # Documentation-only pushes cannot change the binary.
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/workflows/R-CMD-check.yaml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-binary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Make sure the rolling release exists before the matrix races to upload
  # into it, and refresh its notes with the commit the assets came from.
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create or refresh the win-latest pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^Version: *//p' DESCRIPTION | tr -d '\r')
          notes=$(cat <<EOF
          Pre-built Windows binaries of the current \`main\`, so you do not have to
          compile the C++ yourself.

          Built from [\`${SHA:0:7}\`](https://github.com/${REPO}/commit/${SHA}).

          Assets are named \`fast.string_<package version>-<R minor>.zip\`. Pick the
          one matching your R minor version (\`getRversion()\`), then:

          \`\`\`r
          install.packages(
              "https://github.com/${REPO}/releases/download/win-latest/fast.string_${version}-4.6.zip",
              repos = NULL, type = "win.binary")
          \`\`\`

          The URLs are stable; the assets are replaced on every push to \`main\`.
          Dependencies are not resolved by this route, so if it is a first
          install, get them first:

          \`\`\`r
          install.packages(c("cli", "data.table", "Rcpp", "RcppParallel", "rlang"))
          \`\`\`
          EOF
          )
          if gh release view win-latest --repo "$REPO" >/dev/null 2>&1; then
            gh release edit win-latest --repo "$REPO" --notes "$notes"
          else
            gh release create win-latest --repo "$REPO" \
              --prerelease \
              --title "Windows binaries (rolling, built from main)" \
              --notes "$notes"
          fi

  build:
    needs: release
    runs-on: windows-latest

    name: R ${{ matrix.r }}

    strategy:
      fail-fast: false
      matrix:
        # Each supported R minor version is pinned here rather than being
        # reached at through `oldrel-N`, which slides down a version every
        # time R puts out a new minor and would silently drop a build people
        # are installing. Two entries must never resolve to the same minor:
        # they would then race to upload the same asset. When R 4.7 ships,
        # add '4.6' here -- 'release' will have moved on to 4.7 by then.
        r: ['release', '4.5']

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      # PCRE2 comes from Rtools on Windows, so there is nothing to install.
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true

      # Imports and LinkingTo only. Suggests are not needed to compile or
      # install, and pulling shiny and friends in would cost more than the
      # build does.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'

      - name: Build source tarball and Windows binary
        shell: bash
        run: |
          set -euo pipefail
          # The compile is the whole cost of this job; use every core. An
          # empty -j means unlimited parallelism, so fall back to a number.
          cores=$(nproc 2>/dev/null || echo 2)
          echo "building with $cores cores"
          export MAKEFLAGS="-j${cores}"
          R CMD build --no-build-vignettes --no-manual .
          tarball=$(ls fast.string_*.tar.gz)
          echo "built $tarball"
          R CMD INSTALL --build --no-multiarch "$tarball"
          ls -l fast.string_*.zip

      - name: Name the assets after the R minor version
        id: name
        shell: bash
        run: |
          set -euo pipefail
          # Trim the patch level in the shell, not in an `Rscript -e` regex.
          # On Windows, Rscript hands the expression to the command shell,
          # which eats the `^` out of a character class, so the obvious
          # `sub("[.][^.]*$", "", getRversion())` quietly returned the whole
          # "4.6.2" and the asset got named after the patch version.
          rfull=$(Rscript -e 'cat(as.character(getRversion()))')
          rminor=${rfull%.*}
          version=$(sed -n 's/^Version: *//p' DESCRIPTION | tr -d '\r')
          echo "R $rfull -> minor $rminor, package version $version"
          # See the note at the top of this file: everything after the first
          # `_` has to be digits, dots and dashes, or install.packages()
          # cannot work the package name out of the URL.
          zipname="fast.string_${version}-${rminor}.zip"
          mkdir -p dist
          cp "fast.string_${version}.zip" "dist/${zipname}"
          cp "fast.string_${version}.tar.gz" "dist/fast.string_${version}.tar.gz"
          {
            echo "rminor=$rminor"
            echo "version=$version"
            echo "zipname=$zipname"
          } >> "$GITHUB_OUTPUT"
          ls -l dist

      # Downloadable from the run page as well, which is handy for a build
      # off a branch or a dispatch that should not touch the release.
      - uses: actions/upload-artifact@v4
        with:
          name: fast.string-R${{ steps.name.outputs.rminor }}
          path: dist/*
          retention-days: 30

      - name: Attach the binary to the rolling release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload win-latest --repo "$REPO" --clobber \
            "dist/${{ steps.name.outputs.zipname }}"

      # The source tarball is identical from every job in the matrix, so only
      # one of them may upload it. Two concurrent uploads of one asset name
      # get rejected with an HTTP 404 from the uploads API and fail the job,
      # which is how this workflow broke even though both builds succeeded.
      - name: Attach the source tarball to the rolling release
        if: github.ref == 'refs/heads/main' && matrix.r == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload win-latest --repo "$REPO" --clobber \
            "dist/fast.string_${{ steps.name.outputs.version }}.tar.gz"

      - name: Install line for this build
        shell: bash
        run: |
          {
            echo "### fast.string ${{ steps.name.outputs.version }} for R ${{ steps.name.outputs.rminor }}"
            echo
            echo '```r'
            echo 'install.packages('
            echo "    \"https://github.com/${{ github.repository }}/releases/download/win-latest/${{ steps.name.outputs.zipname }}\","
            echo '    repos = NULL, type = "win.binary")'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
